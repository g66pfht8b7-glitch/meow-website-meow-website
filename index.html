<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Glowtime MEOW</title>
<style>
  @import url('https://googleapis.com');
  body{margin:0;background:#000;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;font-family:'Montserrat',sans-serif}
  canvas{position:absolute;top:0;left:0}
  .brand{position:relative;z-index:10;margin-top:265px;display:flex;flex-direction:column;align-items:center;user-select:none;animation:reveal 1.5s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes reveal{0%{opacity:0;transform:translateY(20px) scale(.94);filter:blur(8px)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
  .text{position:relative;font-size:64px;font-weight:900;letter-spacing:3px;line-height:1;display:flex;overflow:hidden;padding:4px 8px}
  .text::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(110deg,transparent 15%,rgba(255,255,255,.7) 50%,transparent 85%);transform:skewX(-20deg);animation:shimmer 4s ease-in-out infinite}
  @keyframes shimmer{0%,45%{left:-120%}75%,100%{left:160%}}
  .w{color:#fff;animation:wBreath 3.5s ease-in-out infinite alternate}
  @keyframes wBreath{0%{text-shadow:0 0 12px rgba(255,255,255,.25)}100%{text-shadow:0 0 24px rgba(56,189,248,.6),0 0 10px rgba(255,255,255,.6)}}
  .r{color:#e61c3a;display:inline-block;animation:rPulse 2.5s ease-in-out infinite alternate}
  @keyframes rPulse{0%{filter:brightness(.95);text-shadow:0 0 16px rgba(230,28,58,.6);transform:scale(1)}100%{filter:brightness(1.22);text-shadow:0 0 28px #e61c3a,0 0 48px rgba(255,90,50,.6);transform:scale(1.03)}}
  .line{position:relative;width:92%;height:6px;background:linear-gradient(90deg,#b8122b,#ff2446,#b8122b);border-radius:99px;margin-top:14px;overflow:hidden;animation:expand 1.3s cubic-bezier(.16,1,.3,1) forwards,rPulse 2.5s ease-in-out infinite alternate}
  .line::after{content:"";position:absolute;top:0;left:-50%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,220,225,.9),transparent);animation:glide 3s ease-in-out infinite}
  @keyframes expand{0%{width:0;opacity:0}100%{width:92%;opacity:1}}
  @keyframes glide{0%{left:-50%}100%{left:120%}}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="brand">
    <div class="text"><span class="w">M</span><span class="r">E</span><span class="w">OW</span></div>
    <div class="line"></div>
  </div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,t=0,intro=0;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
window.addEventListener('resize',resize);resize();

const cat=[{x:-155,y:58},{x:-115,y:-65},{x:-48,y:-5},{x:48,y:-5},{x:115,y:-65},{x:155,y:58},{x:-155,y:58}];
const offY=-50;

function getPath(sc,sx,sy,dx,dy,amp,ph){
  const pts=new Array();
  for(let i=0;i<cat.length-1;i++){
    const p0=cat[i],p1=cat[i+1];
    for(let s=0;s<32;s++){
      const r=s/32,rx=p0.x+(p1.x-p0.x)*r,ry=p0.y+(p1.y-p0.y)*r;
      pts.push({
        x:W/2+(rx*sx+dx+Math.sin(ry*.025+ph)*amp)*sc,
        y:H/2+offY+(ry*sy+dy+Math.cos(rx*.025+ph)*amp)*sc
      });
    }
  }
  return pts;
}

function drawLoop(pts){
  ctx.beginPath();
  const n=pts.length;
  ctx.moveTo((pts[n-1].x+pts.x)/2,(pts[n-1].y+pts.y)/2);
  for(let i=0;i<n;i++){
    const nx=pts[(i+1)%n];
    ctx.quadraticCurveTo(pts[i].x,pts[i].y,(pts[i].x+nx.x)/2,(pts[i].y+nx.y)/2);
  }
  ctx.closePath();
}

function getGrad(cx,cy,rad,tilt,a){
  const g=ctx.createLinearGradient(cx-rad*Math.cos(tilt),cy+rad*Math.sin(tilt),cx+rad*Math.cos(tilt),cy-rad*Math.sin(tilt));
  g.addColorStop(0,`rgba(0,155,255,${a})`);
  g.addColorStop(.36,`rgba(145,45,240,${a})`);
  g.addColorStop(.7,`rgba(245,45,130,${a})`);
  g.addColorStop(1,`rgba(255,135,35,${a})`);
  return g;
}

const stars=Array.from({length:26},()=>({
  x:(Math.random()-.5)*400,y:(Math.random()-.5)*240,sz:Math.random()*2+.8,
  vy:-(Math.random()*.35+.1),vx:(Math.random()-.5)*.25,a:Math.random()*.7+.2,
  ph:Math.random()*6.28,col:['#38bdf8','#c084fc','#f472b6','#fb923c','#fff'][Math.floor(Math.random()*5)]
}));

const ribbons=[
  {rx:1.09,ry:1.04,sp:.85,ob:11,wv:5,w:18,b:18,a:.24,tl:.25},
  {rx:1.04,ry:1.09,sp:-.75,ob:12,wv:5,w:17,b:17,a:.24,tl:.45},
  {rx:1.06,ry:1.01,sp:1.05,ob:9,wv:4,w:13,b:12,a:.30,tl:.30},
  {rx:1.01,ry:1.06,sp:-.95,ob:9,wv:4,w:12,b:11,a:.30,tl:.42},
  {rx:1.03,ry:.99,sp:1.25,ob:6,wv:3,w:9,b:8,a:.36,tl:.34},
  {rx:.99,ry:1.03,sp:-1.15,ob:6,wv:3,w:8,b:7,a:.36,tl:.38},
  {rx:1.01,ry:1.01,sp:1.4,ob:4,wv:2,w:6,b:5,a:.40,tl:.36}
];

function loop(){
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  ctx.lineCap=ctx.lineJoin='round';
  if(intro<1)intro=Math.min(1,intro+.018);
  const ez=1-Math.pow(1-intro,3),sc=Math.min(W/460,1.3)*(.9+.1*ez),cx=W/2,cy=H/2+offY,rad=210*sc;

  const auraP=1.12+Math.sin(t*1.2)*.03;
  drawLoop(getPath(sc,auraP,auraP,0,0,4,t*.5));
  ctx.strokeStyle=getGrad(cx,cy,rad,.35,.28*ez);ctx.lineWidth=60*sc;ctx.filter='blur(46px)';ctx.stroke();

  ribbons.forEach((r,i)=>{
    const ang=t*r.sp+i*.9,br=1+Math.sin(t*1.2+i*.7)*.018;
    drawLoop(getPath(sc,r.rx*br,r.ry*br,Math.cos(ang)*r.ob,Math.sin(ang)*r.ob,r.wv,t*1.4+i*.8));
    ctx.strokeStyle=getGrad(cx,cy,rad,r.tl+Math.sin(t*.4+i)*.14,r.a*ez);
    ctx.lineWidth=r.w*sc;ctx.filter=`blur(${r.b}px)`;ctx.stroke();
  });

  const core=getPath(sc,1,1,0,0,0,0);
  [[9.5,7,.88],[4.5,3,.96]].forEach(([w,b,a])=>{
    drawLoop(core);ctx.strokeStyle=getGrad(cx,cy,rad,.38,a*ez);ctx.lineWidth=w*sc;ctx.filter=`blur(${b}px)`;ctx.stroke();
  });
  drawLoop(core);ctx.strokeStyle=`rgba(255,255,255,${.76*ez})`;ctx.lineWidth=2*sc;ctx.filter='blur(1.2px)';ctx.stroke();

  const tot=core.length,head=Math.floor((t*48)%tot);
  for(let i=0;i<26;i++){
    const i1=(head-i+tot)%tot,i2=(head-i-1+tot)%tot,pr=1-i/26;
    ctx.beginPath();ctx.moveTo(core[i1].x,core[i1].y);ctx.lineTo(core[i2].x,core[i2].y);
    ctx.strokeStyle=`rgba(255,255,255,${pr*.85*ez})`;ctx.lineWidth=(2+pr*3.5)*sc;ctx.filter=`blur(${1.5+(1-pr)*3}px)`;ctx.stroke();
  }

  ctx.filter='blur(.8px)';
  stars.forEach(p=>{
    p.y+=p.vy;p.x+=p.vx+Math.sin(t+p.ph)*.15;if(p.y<-150)p.y=130;
    ctx.beginPath();ctx.arc(cx+p.x*sc,cy+p.y*sc,p.sz*sc,0,6.28);
    ctx.fillStyle=p.col;ctx.globalAlpha=(.5+.5*Math.sin(t*2.5+p.ph))*p.a*ez;ctx.fill();
  });
  ctx.globalAlpha=1;ctx.filter='none';t+=.024;requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
